# .github/workflows/ci.yml - Central CI Pipeline for HireGen AI
name: HireGen AI CI Pipeline

on:
  push:
    branches:
      - main
      - master
      - 'feature/**'
  pull_request:
    branches:
      - main
      - master

jobs:
  # -------------------------------------------------------------
  # 1. Backend Validation (Safe for JS backends)
  # -------------------------------------------------------------
  backend-ci:
    name: Backend Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v3

      - name: Setup Node.js Environment
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: |
          cd backend
          npm ci

      - name: Build Check (Safe No-Op)
        run: |
          cd backend
          npm run build --if-present

      - name: Run Tests
        run: |
          cd backend
          npm run test --if-present

  # -------------------------------------------------------------
  # 2. Frontend Validation
  # -------------------------------------------------------------
  frontend-ci:
    name: Frontend Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v3

      - name: Setup Node.js Environment
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm install --no-audit --no-fund

      - name: Compile Frontend
        run: |
          cd frontend
          npm run build --if-present

  # -------------------------------------------------------------
  # 3. Docker Image Build Verifications
  # -------------------------------------------------------------
  docker-ci:
    name: Verify Docker Container Builds
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v3

      - name: Verify Backend Image Build
        run: |
          docker build -f docker/backend.Dockerfile -t hiregen-backend:test .

      - name: Verify Frontend Image Build
        run: |
          docker build -f docker/frontend.Dockerfile --build-arg APP_DIR=frontend -t hiregen-frontend:test .

      - name: Verify n8n Image Build
        run: |
          docker build -f docker/n8n.Dockerfile -t hiregen-n8n:test .

      - name: Verify Nginx Gateway Image Build
        run: |
          docker build -f docker/nginx-proxy.Dockerfile -t hiregen-nginx-proxy:test .
