user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Performance Optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    client_max_body_size 25M; # Supports bulk signal payloads and attachments

    # Logging Format (Structured JSON for Observability compliance SRS Section 19/22)
    log_format json_analytics escape=json '{'
        '"time_local":"$time_local",'
        '"remote_addr":"$remote_addr",'
        '"request":"$request",'
        '"status": "$status",'
        '"body_bytes_sent":"$body_bytes_sent",'
        '"request_time":"$request_time",'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_response_time":"$upstream_response_time"'
    '}';

    access_log /var/log/nginx/access.log json_analytics;
    error_log /var/log/nginx/error.log warn;

    # Rate Limiting Zones (SRS Section 18 Security Requirements)
    # Auth Endpoints: Strict 5 requests/sec to prevent brute force
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
    # Webhooks Ingestion (n8n/Signals): 30 requests/sec with burst
    limit_req_zone $binary_remote_addr zone=webhook_limit:10m rate=30r/s;
    # General API Gateway: 20 requests/sec
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Include virtual host configurations
    include /etc/nginx/conf.d/*.conf;
}
